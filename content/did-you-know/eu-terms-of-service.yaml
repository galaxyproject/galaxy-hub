title: Updated Terms of Service for Galaxy Europe
tease: New Terms of Service for usegalaxy.eu - please review and accept to keep using the service
body: |
  Usegalaxy.eu has published its updated **Terms of Service**. The new
  Terms bring clearer rules on acceptable use, account maintenance, data
  retention, and your rights under the GDPR.
 
  - **Inactivity policy:** accounts with no login for 12 months are deactivated;
    user-generated data is deleted after a further 6 months.
  - **Automated protective measures:** abusive behaviour may trigger an automatic suspension,
    with human review available on request.
  - **Your responsibility:** you must keep your email address valid.

