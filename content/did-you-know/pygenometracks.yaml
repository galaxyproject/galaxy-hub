title: pyGenomeTracks in Galaxy
tease: Plot entire genomes in a publication-ready way, right inside Galaxy.
body: |
  **pyGenomeTracks** lets you stack multiple genomic formats (including BED, GTF, bedgraph, bigWig, fasta, maf and Hi-C tracks) into a single
  publication-ready figure. You can run it on any Galaxy instance with no local
  install, and tweak track order, colors, and scales interactively before
  exporting a high-resolution image.
