title: Storage Management on Galaxy Europe
tease: 250 GB free quota, short-term scratch storage, and bring-your-own-storage options.
body: |
  Every user on the European Galaxy server gets **250 GB of free storage**. Need
  more? You can use **2 TB of short-term scratch storage** for method
  development, export results to public archives like ENA or Zenodo, or even
  **bring your own storage** (S3, iRODS, OneData, and more). The storage
  dashboard helps you clean up and stay within quota.
