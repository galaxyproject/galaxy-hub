title: Intergalactic Workflow Commission
tease: A curated collection of high-quality, production-ready Galaxy workflows.
body: |
  The **Intergalactic Workflow Commission (IWC)** maintains a vetted library of
  best-practice Galaxy workflows for common analyses. RNA-seq, variant calling,
  metagenomics, and more. Each workflow is versioned, tested, and ready to import
  directly into your Galaxy instance so you can run reproducible pipelines without
  building them from scratch.
