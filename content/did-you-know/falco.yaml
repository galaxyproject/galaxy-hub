title: Falco - a faster FastQC
tease: Get the same QC plots as FastQC in a fraction of the time.
body: |
  **Falco** produces the same quality-control reports as FastQC but runs
  considerably faster and uses less memory, making it well suited to large
  sequencing datasets. The plots and summary sections match FastQC's, so existing
  QC interpretations carry over directly, just swap the tool in your workflow.
