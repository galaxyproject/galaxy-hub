<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="920" height="440" fill="#ffffff"/>
  <defs><marker id="m1" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#6b7280"/></marker></defs>

  <text x="460" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#2c3143">Where a prototype goes next</text>
  <text x="460" y="50" text-anchor="middle" font-size="11" fill="#6b7280">Each step widens the audience and raises what is required of the tool.</text>

  <!-- axis -->
  <line x1="60" y1="360" x2="866" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="382" font-size="10" fill="#9aa5b4">just you</text>
  <text x="866" y="382" text-anchor="end" font-size="10" fill="#9aa5b4">every Galaxy user</text>

  <!-- step 1 -->
  <rect x="56" y="252" width="186" height="96" rx="8" fill="#fdf3e3" stroke="#d99b3f" stroke-width="1.5"/>
  <text x="149" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c3143">User-defined tool</text>
  <text x="149" y="296" text-anchor="middle" font-size="10" fill="#4a5568">YAML, in one Galaxy's</text>
  <text x="149" y="311" text-anchor="middle" font-size="10" fill="#4a5568">database, private to you</text>
  <text x="149" y="333" text-anchor="middle" font-size="10" font-weight="600" fill="#8a5f1a">minutes · beta</text>

  <!-- step 2 -->
  <rect x="262" y="196" width="186" height="152" rx="8" fill="#f4f6f9" stroke="#9aa5b4" stroke-width="1.5"/>
  <text x="355" y="220" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c3143">Shared in a workflow</text>
  <text x="355" y="242" text-anchor="middle" font-size="10" fill="#4a5568">Anyone importing the</text>
  <text x="355" y="257" text-anchor="middle" font-size="10" fill="#4a5568">workflow gets a copy of</text>
  <text x="355" y="272" text-anchor="middle" font-size="10" fill="#4a5568">the tool in their account</text>
  <rect x="284" y="286" width="142" height="42" rx="5" fill="#ffffff"/>
  <text x="355" y="303" text-anchor="middle" font-size="9.5" fill="#6b7280">Still untested, still</text>
  <text x="355" y="317" text-anchor="middle" font-size="9.5" fill="#6b7280">unversioned</text>
  <text x="355" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">your group</text>

  <!-- step 3 -->
  <rect x="468" y="128" width="186" height="220" rx="8" fill="#e8f0f8" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="561" y="152" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c3143">IUC tool</text>
  <text x="561" y="172" text-anchor="middle" font-size="10" fill="#4a5568">XML wrapper in</text>
  <text x="561" y="187" text-anchor="middle" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#4a5568">tools-iuc</text>
  <rect x="490" y="200" width="142" height="102" rx="5" fill="#ffffff"/>
  <text x="561" y="219" text-anchor="middle" font-size="9.5" fill="#6b7280">Peer reviewed</text>
  <text x="561" y="236" text-anchor="middle" font-size="9.5" fill="#6b7280">Tests actually run</text>
  <text x="561" y="253" text-anchor="middle" font-size="9.5" fill="#6b7280">Versioned lineage</text>
  <text x="561" y="270" text-anchor="middle" font-size="9.5" fill="#6b7280">Tool Shed installable</text>
  <text x="561" y="287" text-anchor="middle" font-size="9.5" fill="#6b7280">Wraps packaged software</text>
  <text x="561" y="322" text-anchor="middle" font-size="10" font-weight="600" fill="#3a6ea5">a rewrite, not a conversion</text>
  <text x="561" y="340" text-anchor="middle" font-size="10" fill="#6b7280">anyone who installs it</text>

  <!-- step 4 -->
  <rect x="674" y="80" width="192" height="268" rx="8" fill="#e4efe6" stroke="#5a9367" stroke-width="1.5"/>
  <text x="770" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c3143">IWC workflow</text>
  <text x="770" y="124" text-anchor="middle" font-size="10" fill="#4a5568">Published in</text>
  <text x="770" y="139" text-anchor="middle" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#4a5568">galaxyproject/iwc</text>
  <rect x="696" y="152" width="148" height="150" rx="5" fill="#ffffff"/>
  <text x="770" y="171" text-anchor="middle" font-size="9.5" fill="#6b7280">Tool versions pinned</text>
  <text x="770" y="188" text-anchor="middle" font-size="9.5" fill="#6b7280">Passes Best Practices</text>
  <text x="770" y="205" text-anchor="middle" font-size="9.5" fill="#6b7280">Licensed, ORCID creator</text>
  <text x="770" y="222" text-anchor="middle" font-size="9.5" fill="#6b7280">Tested on every change</text>
  <text x="770" y="245" text-anchor="middle" font-size="9.5" font-weight="600" fill="#33613e">Auto-installed on</text>
  <text x="770" y="261" text-anchor="middle" font-size="9.5" fill="#33613e">usegalaxy.org · .eu · .org.au</text>
  <text x="770" y="284" text-anchor="middle" font-size="9.5" fill="#6b7280">Registered on Dockstore</text>
  <text x="770" y="298" text-anchor="middle" font-size="9.5" fill="#6b7280">and WorkflowHub</text>
  <text x="770" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#33613e">the whole community</text>

  <path d="M246,300 L258,300" stroke="#6b7280" stroke-width="2" marker-end="url(#m1)" fill="none"/>
  <path d="M452,270 L464,270" stroke="#6b7280" stroke-width="2" marker-end="url(#m1)" fill="none"/>
  <path d="M658,230 L670,230" stroke="#6b7280" stroke-width="2" marker-end="url(#m1)" fill="none"/>

  <text x="460" y="410" text-anchor="middle" font-size="10.5" fill="#6b7280">An agent can do the promotion work too — draft the wrapper, write real tests, run planemo, open the pull request.</text>
  <text x="460" y="428" text-anchor="middle" font-size="10.5" fill="#8a5f1a">There is no automated conversion from a user-defined tool to an XML tool. The prototype informs the rewrite; it does not become it.</text>
</svg>
