<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="882" viewBox="0 0 1240 882">
<rect width="1240" height="882" fill="#ffffff"/>
<text x="64" y="48" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#1a1c1f" font-weight="bold" text-anchor="start">Same pipeline, different implementation</text>
<text x="64" y="74" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#5b6470" font-weight="normal" text-anchor="start">CDC's released R workflow and PyEuk, stage for stage, on the same haplotype sheet</text>
<text x="64" y="146" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#5b6470" font-weight="bold" text-anchor="start">STAGE</text>
<rect x="238" y="124" width="290" height="30" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.3"/>
<text x="252" y="144" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="start">CDC legacy (R)</text>
<rect x="548" y="124" width="290" height="30" rx="6" fill="#f1f8f3" stroke="#2e7d52" stroke-width="1.3"/>
<text x="562" y="144" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#2e7d52" font-weight="bold" text-anchor="start">PyEuk (Python)</text>
<text x="890" y="144" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#5b6470" font-weight="bold" text-anchor="start">WHAT CHANGED</text>
<line x1="64" y1="160" x2="1176" y2="160" stroke="#d8dde3" stroke-width="1"/>
<text x="64" y="186" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1c1f" font-weight="bold" text-anchor="start">Input</text>
<text x="252" y="186" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">haplotype detection sheet</text>
<text x="562" y="186" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">haplotype detection sheet</text>
<text x="890" y="186" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5b6470" font-weight="normal" text-anchor="start">same file, same 165 columns</text>
<line x1="64" y1="234" x2="1176" y2="234" stroke="#d8dde3" stroke-width="1"/>
<text x="64" y="260" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1c1f" font-weight="bold" text-anchor="start">Encode</text>
<text x="252" y="260" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">X / empty read as presence</text>
<text x="562" y="260" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">X = (values == "X")</text>
<text x="890" y="260" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5b6470" font-weight="normal" text-anchor="start">identical information kept</text>
<line x1="64" y1="308" x2="1176" y2="308" stroke="#d8dde3" stroke-width="1"/>
<text x="64" y="334" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1c1f" font-weight="bold" text-anchor="start">Missing data</text>
<text x="252" y="334" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">empty cell = absent</text>
<text x="562" y="334" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">empty locus block = not typed</text>
<text x="890" y="334" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#2e7d52" font-weight="bold" text-anchor="start">dropout no longer scored as absence</text>
<line x1="64" y1="382" x2="1176" y2="382" stroke="#d8dde3" stroke-width="1"/>
<text x="64" y="408" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1c1f" font-weight="bold" text-anchor="start">Distance</text>
<text x="252" y="408" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">Barratt heuristic + Plucinski</text>
<text x="252" y="425" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">Bayesian, combined by rank</text>
<text x="562" y="408" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">binary wIBS, pairwise-complete</text>
<text x="562" y="425" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">over loci typed in both</text>
<text x="890" y="408" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#b8860b" font-weight="normal" text-anchor="start">one metric instead of two;</text>
<text x="890" y="425" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#b8860b" font-weight="normal" text-anchor="start">the rank step is gone</text>
<line x1="64" y1="456" x2="1176" y2="456" stroke="#d8dde3" stroke-width="1"/>
<text x="64" y="482" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1c1f" font-weight="bold" text-anchor="start">Geometry</text>
<text x="252" y="482" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">not positive semi-definite;</text>
<text x="252" y="499" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">self-distances up to 4.454</text>
<text x="562" y="482" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">eigenvalue clipping;</text>
<text x="562" y="499" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">lambda_min &gt;= 0</text>
<text x="890" y="482" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#2e7d52" font-weight="bold" text-anchor="start">Ward's assumption now holds</text>
<line x1="64" y1="530" x2="1176" y2="530" stroke="#d8dde3" stroke-width="1"/>
<text x="64" y="556" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1c1f" font-weight="bold" text-anchor="start">Linkage</text>
<text x="252" y="556" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">agnes(diss=TRUE, ward)</text>
<text x="562" y="556" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">scipy linkage(ward)</text>
<text x="890" y="556" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#5b6470" font-weight="normal" text-anchor="start">same method</text>
<line x1="64" y1="604" x2="1176" y2="604" stroke="#d8dde3" stroke-width="1"/>
<text x="64" y="630" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1a1c1f" font-weight="bold" text-anchor="start">Choose k</text>
<text x="252" y="630" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">cut calibrated from the</text>
<text x="252" y="647" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">gold-standard cluster file</text>
<text x="562" y="630" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">merge-height gap,</text>
<text x="562" y="647" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#1a1c1f" font-weight="normal" text-anchor="start">no labels used</text>
<text x="890" y="630" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#2e7d52" font-weight="bold" text-anchor="start">runs without an answer key</text>
<line x1="64" y1="678" x2="1176" y2="678" stroke="#d8dde3" stroke-width="1"/>
<rect x="64" y="702" width="1112" height="128" rx="6" fill="#f5f6f7" stroke="#d8dde3" stroke-width="1.2"/>
<text x="84" y="728" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#5b6470" font-weight="bold" text-anchor="start">MEASURED, NOT QUOTED</text>
<text x="84" y="752" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">runtime, 153 specimens</text>
<text x="252" y="752" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">370 s, 507 s, 655 s</text>
<text x="562" y="752" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">1.56 s, 1.56 s, 1.73 s</text>
<text x="890" y="752" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#2e7d52" font-weight="bold" text-anchor="start">230-400x faster</text>
<text x="84" y="776" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">same input twice</text>
<text x="252" y="776" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">ensemble: 66.8% of cells differ</text>
<text x="562" y="776" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">byte-identical</text>
<text x="890" y="776" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#2e7d52" font-weight="bold" text-anchor="start">reproducible</text>
<text x="84" y="800" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">matrix symmetry</text>
<text x="252" y="800" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">24.1% of pairs differ</text>
<text x="562" y="800" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1a1c1f" font-weight="normal" text-anchor="start">symmetric by construction</text>
<text x="890" y="800" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#2e7d52" font-weight="bold" text-anchor="start">fixed</text>
<text x="64" y="838" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#5b6470" font-weight="normal" text-anchor="start">Runtimes are three wall-clock runs of each on one host: legacy heuristic under R 4.1.3 on 11 threads, PyEuk in the pinned container. The two</text>
<text x="64" y="855" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#5b6470" font-weight="normal" text-anchor="start">compute different distances, and PyEuk scores 144 of the 153 specimens. The 99.2x speedup in the project's documents is a different comparison and is not reproduced here.</text>
</svg>