# This Action will run in the following scenarios:
# - on Pull Requests containing images (not including forks)
# - on pushing of images to `main` (for forks)
# - on demand (https://github.blog/changelog/2020-07-06-github-actions-manual-triggers-with-workflow_dispatch/)
# - at 11 PM every Sunday if anything gets missed with any of the above scenarios
# PNG and JPEG images are optimized losslessly (optipng, jpegoptim) by scripts/optimize-images.py,
# which keeps a result only when every pixel, the ICC profile and the EXIF data are unchanged.
# For Pull Requests, the optimizer is taken from the base commit, so no PR code runs in this job,
# and the optimized images are committed to the PR. The bot token is passed only to the git and gh calls that need it.
# For other scenarios, a new PR will be opened if any images are optimized.
name: Compress images
on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
  push:
    branches:
      - main
    paths:
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
  workflow_dispatch:
  schedule:
    - cron: "00 23 * * 0"
concurrency:
  group: compress-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Lossless image optimization
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Only run on main repo and on PRs that match the main repo.
    # Skip when the bot's own compression commit re-triggers this workflow
    # (synchronize + bot actor) to break the infinite loop. Safe for
    # bot-authored PRs (e.g. GTN imports) because those trigger as
    # 'opened', not 'synchronize'.
    # Also skip the bot's own action_compress_images PR and the push its merge makes.
    if: |
      github.repository == 'galaxyproject/galaxy-hub' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event_name == 'pull_request' && github.event.action == 'synchronize' && startsWith(github.actor, 'galaxy-hub-bot')) &&
      !(github.event_name == 'pull_request' && github.head_ref == 'action_compress_images') &&
      !(github.event_name == 'push' &&
        (contains(github.event.head_commit.message, 'action_compress_images') ||
         startsWith(github.event.head_commit.message, 'Compress Images')))
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUB_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read
      - name: Checkout Branch
        uses: actions/checkout@v7
        with:
          # PRs check out the event's head commit; the push below only lands if the branch is still there.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Install optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends optipng jpegoptim
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pillow==13.0.0
      - name: Compress Images
        id: optimize
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORT: ${{ runner.temp }}/optimize-images.md
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" > /dev/null; then
              echo "::error::The PR base commit ${BASE_SHA} is not in the checkout."
              exit 1
            fi
            if ! git rev-parse --verify --quiet "${BASE_SHA}:scripts/optimize-images.py" > /dev/null; then
              echo "::notice::The base branch has no scripts/optimize-images.py yet; skipping image optimization."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Run the base commit's optimizer on the PR checkout, so a PR cannot change the code this job runs.
            script="${RUNNER_TEMP}/optimize-images.py"
            git show "${BASE_SHA}:scripts/optimize-images.py" > "$script"
            python "$script" --changed-since "$BASE_SHA" --markdown "$REPORT"
          else
            python scripts/optimize-images.py --all --markdown "$REPORT"
          fi
      - name: Commit to Pull Request
        if: |
          github.event_name == 'pull_request' &&
          steps.optimize.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/optimize-images.md
        run: |
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${basic_auth}"
          git_auth() {
            git -c core.hooksPath=/dev/null -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${basic_auth}" "$@"
          }
          # A failed query (network, auth) stops the job; only an empty answer means the branch was deleted.
          branch_moved() {
            if ! refs="$(git_auth ls-remote origin "refs/heads/${HEAD_REF}")"; then
              echo "::error::Could not read the PR branch from origin."
              exit 1
            fi
            [ "$(printf '%s' "$refs" | cut -f1)" != "$HEAD_SHA" ]
          }
          if branch_moved; then
            echo "::notice::The PR branch moved or was deleted during this run; not pushing optimized images."
            exit 0
          fi
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit --all --message "Compress Images"
          # The new commit's parent is HEAD_SHA, so this is a fast-forward that only lands while the branch is still at HEAD_SHA.
          if ! git_auth push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" origin "HEAD:refs/heads/${HEAD_REF}"; then
            if branch_moved; then
              echo "::notice::The PR branch moved during the push; not pushing optimized images."
              exit 0
            fi
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body-file "$REPORT"
      - name: Create Pull Request
        # If it's not a Pull Request then commit any changes as a new PR.
        if: |
          github.event_name != 'pull_request' &&
          steps.optimize.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: Auto Compress Images
          branch: action_compress_images
          commit-message: Compress Images
          body-path: ${{ runner.temp }}/optimize-images.md
