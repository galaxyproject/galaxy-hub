# Runs the unit tests of scripts/optimize-images.py with the same optimizers and Pillow
# version as optimize-images.yml. REQUIRE_OPTIMIZERS=1 turns skipped optimizer tests into failures.
name: Test image optimizer
on:
  pull_request:
    paths:
      - scripts/optimize-images.py
      - scripts/test_optimize_images.py
      - .github/workflows/optimize-images*.yml
  push:
    branches:
      - main
    paths:
      - scripts/optimize-images.py
      - scripts/test_optimize_images.py
      - .github/workflows/optimize-images*.yml
permissions:
  contents: read
jobs:
  test:
    name: Image optimizer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends optipng jpegoptim
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pillow==13.0.0
      - name: Run tests
        env:
          REQUIRE_OPTIMIZERS: "1"
        run: python scripts/test_optimize_images.py -v
