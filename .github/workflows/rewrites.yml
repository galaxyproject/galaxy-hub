name: Deploy CloudFront Rewrites Function

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/rewrites.js'
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/rewrites.js'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run tests
        run: node deploy/test-rewrites.js

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.repository_owner == 'galaxyproject' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy CloudFront Rewrites Function
        uses: dhollerbach/actions.deploy-cloudfront-function@1ba9488455768464328021d230c2b222d1240393 # v1
        with:
          function-name: hub-rewrites
          comment: Deployed from GitHub Actions
          source-file: ./deploy/rewrites.js
