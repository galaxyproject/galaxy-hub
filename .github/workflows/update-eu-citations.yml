name: Update Server Citations
on:
  workflow_dispatch:
  schedule:
    - cron: '00 23 * * 0'

permissions:
  contents: read

jobs:
  update-citations:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'galaxyproject'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUB_BOT_APP_PRIVATE_KEY }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Sync citation bibliographies
        id: sync
        run: python scripts/update-eu-citations.py

      - name: Create Pull Request
        if: ${{ success() || steps.sync.outputs.synced == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore(citations): update server citations'
          title: 'Update server citation bibliographies'
          body: 'Auto-generated PR with updated citation bibliographies for Galaxy Europe and the subsite servers.'
          branch: update-eu-citations
          delete-branch: true
